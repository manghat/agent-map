name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uvx --python ${{ matrix.python }} --from . agent-map --demo --no-open -o "$RUNNER_TEMP/demo.html"
