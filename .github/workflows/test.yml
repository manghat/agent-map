name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: run the packed tarball the way npx would
        run: |
          TGZ=$(npm pack --silent)
          npx --yes --package="./$TGZ" agent-map --demo --no-open -o "$RUNNER_TEMP/demo.html"
          test -s "$RUNNER_TEMP/demo.html"
